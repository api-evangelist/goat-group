aid: goat-group
name: Goat Group
description: >-
  Goat Group is the parent company behind a family of global marketplaces for
  sneakers, apparel, and luxury goods, operating the GOAT marketplace and app
  (goat.com), the Flight Club consignment stores and site, the Grailed
  peer-to-peer menswear and streetwear community, and the alias B2B platform.
  Founded in 2015 by Eddy Lu and Daishin Sugano and headquartered in Los
  Angeles (Culver City), California, the company began as a sneaker
  marketplace that pioneered ship-to-verify authentication and grew into one
  of the largest platforms for buying and selling new and pre-owned style. Goat
  Group went through Y Combinator (Winter 2015) and has raised capital from
  investors including D1 Capital Partners, Park West Asset Management, Foot
  Locker, Index Ventures, and others. The company does not currently publish a
  public developer API program; this profile is a network identity record.
